<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tareas Universitarias</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-9">

            <div class="card shadow mb-4">
                <div class="card-header bg-primary text-white">
                    <h1 class="h3 mb-0">Gestor de Tareas Universitarias</h1>
                </div>
                <div class="card-body">
                    <div id="alert-container"></div>
                    <form id="todo-form" class="mb-4">
                        <div class="row g-3">
                            <div class="col-md-5">
                                <label for="todo-input" class="form-label font-weight-bold">Título de la Tarea</label>
                                <input type="text" id="todo-input" class="form-control" placeholder="Ej. Informe de Laboratorio" autocomplete="off">
                            </div>
                            <div class="col-md-4">
                                <label for="todo-course" class="form-label">Curso</label>
                                <input type="text" id="todo-course" class="form-control" placeholder="Ej. Desarrollo Web" autocomplete="off">
                            </div>
                            <div class="col-md-3">
                                <label for="todo-date" class="form-label">Fecha de Entrega</label>
                                <input type="date" id="todo-date" class="form-control">
                            </div>
                        </div>
                        <div class="mt-3 text-end">
                            <button type="submit" class="btn btn-primary px-4">Agregar Tarea</button>
                        </div>
                    </form>
                    <hr>
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2 class="h5 mb-0">Lista de Tareas Académicas</h2>
                        <div class="btn-group" role="group" id="filter-buttons">
                            <button type="button" class="btn btn-outline-primary active" data-filter="all">Todas</button>
                            <button type="button" class="btn btn-outline-primary" data-filter="pending">Pendientes</button>
                            <button type="button" class="btn btn-outline-primary" data-filter="completed">Completadas</button>
                        </div>
                    </div>
                    <ul id="todo-list" class="list-group">
                    </ul>
                </div>
            </div>

        </div>
    </div>
</div>
<script src="app.js" defer></script>
</body>
</html>
