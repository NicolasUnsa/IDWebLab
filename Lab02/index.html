<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario Lab02</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <main class="fondo">
    <h2>Registro de Estudiante</h2>
    
    <form action="/procesar" method="POST">
      
      <fieldset>
        <legend>Información Personal</legend>

        <div class="grupito">
          <label for="nombre">Nombre Completo:</label>
          <input type="text" id="nombre" name="nombre" class="input" required placeholder="Nicolás Pumacayo">
        </div>

        <div class="grupito">
          <label for="codigo">CUI:</label>
          <input type="text" id="codigo" name="codigo" class="input" required pattern="[0-9]{8}" title="Debe contener exactamente 8 números" placeholder="20263691">
        </div>

        <div class="grupito">
          <label for="edad">Edad:</label>
          <input type="number" id="edad" name="edad" class="input" min="16" max="99" required placeholder="19">
        </div>

        <div class="grupito">
          <label for="fechaNacimiento">Fecha de Nacimiento:</label>
          <input type="date" id="fechaNacimiento" name="fechaNacimiento" class="input" min="1930-01-01" max="2011-12-31" required>
        </div>

        <div class="grupito">
          <label>Turno de Estudio:</label>
          <div class="radio">
            <input type="radio" id="mañana" name="turno" value="mañana" required>
            <label for="mañana">Mañana</label>
            
            <input type="radio" id="tarde" name="turno" value="tarde">
            <label for="tarde">Tarde</label>
            
            <input type="radio" id="noche" name="turno" value="noche">
            <label for="noche">Noche</label>
          </div>
        </div>
      </fieldset>



      <fieldset>
        <legend>Información de la Cuenta</legend>

        <div class="grupito">
          <label for="email">Correo Institucional:</label>
          <input type="email" id="email" name="email" class="input" required placeholder="usuario@unsa.edu.pe">
        </div>

        <div class="grupito">
          <label for="password">Contraseña:</label>
          <input type="password" id="password" name="password" class="input" required pattern="(?=.*\d)(?=.*[A-Z]).{8,}" title="Mínimo 8 caracteres, al menos una mayúscula y un número">
        </div>

        <div class="grupito">
          <label for="carrera">Carrera Profesional:</label>
          <select id="carrera" name="carrera" class="input" required>
            <option value="">-- Seleccione una carrera --</option>
            <option value="sistemas">Ingeniería de Sistemas</option>
            <option value="computacion">Ciencias de la Computación</option>
            <option value="telecomunicaciones">Ingeniería de Telecomunicaciones</option>
            <option value="electrica">Ingeniería Eléctrica</option>
            <option value="electronica">Ingeniería de Electrónica</option>
            <option value="industrial">Ingeniería Industrial</option>
          </select>
        </div>

        <div class="grupito">
          <label for="comentarios">Comentarios:</label>
          <textarea id="comentarios" name="comentarios" class="input" rows="3" placeholder="Ingrese información opcional..."></textarea>
        </div>

        <div class="grupito check">
          <input type="checkbox" id="terminos" name="terminos" required>
          <label for="terminos">Acepto los términos y condiciones del sistema</label>
        </div>
      </fieldset>

      <button type="submit" class="botoncito">Registrar</button>
    </form>
  </main>

</body>
</html>
